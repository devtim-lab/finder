<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Finder — Cari HP</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
  body { background:#f5f5f5; color:#333; padding-bottom:40px; }
  .wrap { max-width:960px; margin:0 auto; background:#fff; min-height:100vh; }
  h1 { padding:16px; font-size:1.8rem; }
  .tabs { display:flex; border-bottom:2px solid #e0e0e0; }
  .tabs div { flex:1; text-align:center; padding:12px; font-size:1.1rem; font-weight:bold; color:#888; cursor:pointer; }
  .tabs .active { color:#D50000; border-bottom:3px solid #D50000; }
  #showBtn {
    display:block; width:calc(100% - 32px); margin:20px 16px; padding:18px;
    background:#D50000; color:#fff; border:none; border-radius:8px;
    font-size:1.3rem; font-weight:bold; cursor:pointer;
  }
  #showBtn:active { background:#a00000; }
  .sec { color:#D50000; font-size:1.3rem; padding:8px 16px 4px; font-weight:bold; }
  .fld { margin:10px 16px; border:1px solid #ddd; border-radius:4px; padding:12px; background:#fff; }
  .fld label { display:block; font-weight:bold; color:#555; margin-bottom:8px; }
  select, input[type=text] {
    width:100%; padding:10px; font-size:1rem; border:1px solid #bbb; border-radius:4px; background:#fff;
  }
  .slider-row { display:flex; align-items:center; gap:10px; }
  .slider-row span { white-space:nowrap; font-size:.85rem; color:#777; }
  input[type=range] { flex:1; accent-color:#D50000; }
  #yrLabel, #prLabel { text-align:center; font-size:.85rem; color:#D50000; font-weight:bold; margin-top:6px; }
  #count { text-align:center; color:#888; font-size:.9rem; padding:4px; }
  #resultsView #results, #resView #results { padding-top:12px; }
  #results { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:12px 16px; }
  .card { border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; text-align:center; background:#fff; }
  .card img { width:100%; height:130px; object-fit:contain; background:#fafafa; }
  .card .nm { font-weight:bold; font-size:.85rem; padding:6px 4px 2px; min-height:44px; }
  .card .meta { font-size:.75rem; color:#888; padding-bottom:8px; }
  .card .meta b { color:#D50000; }
  .empty { grid-column:1/-1; text-align:center; color:#888; padding:40px 0; }
  .dd { position:relative; }
  .dd-btn { width:100%; padding:10px; font-size:1rem; border:1px solid #bbb; border-radius:4px; background:#fff; text-align:left; cursor:pointer; }
  .dd-btn:after { content:'▾'; float:right; color:#888; }
  .dd-panel { display:none; position:absolute; z-index:10; left:0; right:0; top:calc(100% + 4px); border:1px solid #bbb; border-radius:4px; background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.15); max-height:260px; overflow:hidden; }
  .dd-panel.open { display:block; }
  .dd-search { width:100%; padding:10px; border:none; border-bottom:1px solid #eee; font-size:1rem; outline:none; position:sticky; top:0; background:#fff; }
  .dd-list { max-height:200px; overflow-y:auto; }
  .dd-list div { padding:10px; cursor:pointer; font-size:.95rem; }
  .dd-list div:hover { background:#f0f0f0; }
  .dd-list .sel { background:#fdecea; color:#D50000; font-weight:bold; }
  .tag { display:inline-block; font-size:.65rem; padding:1px 6px; border-radius:8px; margin:2px 1px 0; }
  .t-ok { background:#e6f4ea; color:#137333; } .t-no { background:#fce8e6; color:#c5221f; } .t-soon { background:#fff8e1; color:#b06000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Phone Finder</h1>
<div id="formView">
  <div class="tabs"><div class="active" id="tabP">PHONES</div><div id="tabT">TABLETS</div></div>
  <button id="showBtn">SHOW <span id="nRes">0</span> RESULTS</button>
  <div id="count"></div>

  <div class="sec">General</div>
  <div class="fld"><label>BRAND:</label>
    <div class="dd">
      <button type="button" class="dd-btn" id="ddBtn">All Brands</button>
      <div class="dd-panel" id="ddPanel">
        <input type="text" class="dd-search" id="ddSearch" placeholder="Cari brand...">
        <div class="dd-list" id="ddList"></div>
      </div>
    </div>
  </div>
  <div class="fld"><label>YEAR:</label>
    <div class="slider-row"><span>Min <b id="yrMinV">1994</b></span><input type="range" id="yrMin"><span>Max <b id="yrMaxV">2026</b></span><input type="range" id="yrMax"></div>
  </div>
  <div class="fld"><label>AVAILABILITY:</label><select id="avail">
    <option value="">Any</option><option value="0">Available</option><option value="1">Discontinued</option><option value="2">Coming Soon</option>
  </select></div>
  <div class="fld"><label>PRICE (EUR):</label>
    <div class="slider-row"><span>Min <b id="prMinV">0</b></span><input type="range" id="prMin"><span>Max <b id="prMaxV">2000</b></span><input type="range" id="prMax"></div>
  </div>

  <div class="sec">Network</div>
  <div class="fld"><label>2G:</label><select id="g2"><option value="">Any</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="fld"><label>3G:</label><select id="g3"><option value="">Any</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="fld"><label>4G:</label><select id="g4"><option value="">Any</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="fld"><label>5G:</label><select id="g5"><option value="">Any</option><option value="1">Yes</option><option value="0">No</option></select></div>

  <div class="sec">Display</div>
  <div class="fld"><label>DISPLAY TYPE:</label><select id="dtype">
    <option value="">Any</option><option>AMOLED</option><option>Super AMOLED</option>
    <option>OLED</option><option>IPS LCD</option><option>LTPS IPS LCD</option>
    <option>TFT</option><option>LCD</option><option>CSTN</option>
  </select></div>

  <div class="sec">SIM</div>
  <div class="fld"><label>SIM SLOT:</label><select id="sim">
    <option value="">Any</option><option value="2">Dual SIM</option><option value="1">Single SIM</option>
  </select></div>

  <div class="sec">Search</div>
  <div class="fld"><input type="text" id="q" placeholder="Ketik nama HP... (misal: galaxy f70)"></div>
</div>

<div id="resView" style="display:none">
  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid #e0e0e0;position:sticky;top:0;background:#fff;z-index:5">
    <button id="backBtn" style="background:#D50000;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:.9rem;cursor:pointer">← Filter</button>
    <div style="flex:1"><b id="resTitle">Results</b><br><span id="resSub" style="font-size:.78rem;color:#888"></span></div>
  </div>
  <div id="results"></div>
</div>
</div>

const IMG = 'https://fdn2.gsmarena.com/vv/bigpic/';
const $ = id => document.getElementById(id);
const STATUS = ['<span class="tag t-ok">Available</span>','<span class="tag t-no">Discontinued</span>','<span class="tag t-soon">Coming soon</span>',''];

// searchable dropdown brand
let brandSel = '';
function ddRender(){
  const q = $('ddSearch').value.trim().toLowerCase();
  const list = BRANDS.map((b,i)=>({b,i})).filter(x => !q || x.b.toLowerCase().includes(q));
  $('ddList').innerHTML = '<div data-v="" class="'+(brandSel===''?'sel':'')+'">All Brands</div>' +
    list.map(x => `<div data-v="${x.i}" class="${brandSel==String(x.i)?'sel':''}">${x.b} <span style="color:#aaa;font-size:.75rem">(${DATA.filter(p=>p[0]===x.i).length})</span></div>`).join('');
  $('ddList').querySelectorAll('div').forEach(d => d.onclick = () => {
    brandSel = d.dataset.v;
    $('ddBtn').textContent = brandSel==='' ? 'All Brands' : BRANDS[+brandSel];
    $('ddPanel').classList.remove('open');
    run();
  });
}
$('ddBtn').onclick = e => { e.stopPropagation(); $('ddPanel').classList.toggle('open'); $('ddSearch').value=''; ddRender(); setTimeout(()=>$('ddSearch').focus(),0); };
$('ddSearch').addEventListener('input', ddRender);
$('ddSearch').onclick = e => e.stopPropagation();
document.addEventListener('click', e => { if(!e.target.closest('.dd')) $('ddPanel').classList.remove('open'); });

// slider tahun & harga
const YMIN=1994, YMAX=2026, PMAX=2000;
[['yrMin',YMIN],['yrMax',YMAX]].forEach(([id,v])=>{ const e=$(id); e.min=YMIN; e.max=YMAX; e.value=v; });
[['prMin',0],['prMax',PMAX]].forEach(([id,v])=>{ const e=$(id); e.min=0; e.max=PMAX; e.step=10; e.value=v; });

function filters(){
  const yMin=+$('yrMin').value, yMax=+$('yrMax').value, pMin=+$('prMin').value, pMax=+$('prMax').value;
  $('yrMinV').textContent=yMin; $('yrMaxV').textContent=yMax;
  $('prMinV').textContent=pMin; $('prMaxV').textContent=pMax;
  const b=brandSel, av=$('avail').value, sim=$('sim').value;
  const g=[$('g2').value,$('g3').value,$('g4').value,$('g5').value];
  const dt=$('dtype').value;
  const q=$('q').value.trim().toLowerCase();
  return DATA.filter(p=>{
    if(b!=='' && p[0]!==+b) return false;
    if(p[2]<yMin || p[2]>yMax) return false;
    if(av!=='' && p[5]!==+av) return false;
    if(p[3]>0 && (p[3]<pMin || p[3]>pMax)) return false;
    if(p[3]===0 && (pMin>0)) return false;
    if(sim!=='' && p[4]!==+sim) return false;
    for(let i=0;i<4;i++){ if(g[i]!==''){ const has=(p[3]>>i)&1; if(has!==+g[i]) return false; } }
    if(dt && !(p[8]||'').toLowerCase().includes(dt.toLowerCase())) return false;
    if(q && !p[1].toLowerCase().includes(q) && !BRANDS[p[0]].toLowerCase().includes(q)) return false;
    return true;
  });
}

let last = [];
function run(){
  shown = 60;
  last = filters();
  $('nRes').textContent = last.length.toLocaleString();
  $('count').textContent = last.length.toLocaleString() + ' phones found';
  render(last.slice(0, 60));
}
let shown = 60;
function render(list){
  const r = $('results');
  if(!list.length){ r.innerHTML='<div class="empty">Tidak ada HP yang cocok. Kembali ke Filter untuk melonggarkan.</div>'; return; }
  r.innerHTML = list.slice(0, shown).map(p=>`
    <div class="card">
      <img loading="lazy" src="${IMG}${p[6]}.jpg" alt="${p[1]}"
        onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://fdn.gsmarena.com/vv/bigpic/${p[6]}.jpg';}else if(this.dataset.f==1){this.dataset.f=2;this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22130%22><rect fill=%22%23eee%22 width=%22120%22 height=%22130%22/><text x=%2260%22 y=%2270%22 font-size=%2212%22 text-anchor=%22middle%22 fill=%22%23999%22>No Image</text></svg>';}">
      <div class="nm">${p[1]}</div>
      <div class="meta">${BRANDS[p[0]]} · ${p[2]}<br><span style="color:#555">${p[8]||'-'}</span><br>${p[3]?'<b>€'+p[3].toLocaleString()+'</b>':'<span style=color:#aaa>price n/a</span>'}<br>${STATUS[p[5]]}</div>
    </div>`).join('') + (list.length>shown ? `<button id="moreBtn" style="grid-column:1/-1;padding:12px;background:#fff;border:1px solid #D50000;color:#D50000;border-radius:6px;font-weight:bold;cursor:pointer">Muat lainnya (${(list.length-shown).toLocaleString()} lagi)</button>` : '');
  const mb = $('moreBtn');
  if(mb) mb.onclick = ()=>{ shown += 60; render(last); };
}

function goResults(){
  run();
  $('formView').style.display='none';
  $('resView').style.display='block';
  $('resTitle').textContent = last.length.toLocaleString()+' phones found';
  $('resSub').textContent = 'Brand: '+(brandSel===''?'All':BRANDS[+brandSel])+' · Year: '+$('yrMin').value+'-'+$('yrMax').value;
  window.scrollTo(0,0);
}
$('showBtn').onclick = goResults;
$('backBtn').onclick = ()=>{ $('resView').style.display='none'; $('formView').style.display='block'; window.scrollTo(0,0); };
document.querySelectorAll('select,input').forEach(e=>e.addEventListener('input', run));
$('tabP').onclick=()=>{ $('tabP').classList.add('active'); $('tabT').classList.remove('active'); };
$('tabT').onclick=()=>{ $('tabT').classList.add('active'); $('tabP').classList.remove('active'); alert('Data tablets belum tersedia di dataset.'); };
run();
</script>
</body>
</html>
